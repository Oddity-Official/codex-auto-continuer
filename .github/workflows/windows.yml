name: Windows verification and build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install isolated development and build dependencies
        run: |
          & ./scripts/run-project-command.ps1 -FileName (Get-Command python).Source -Arguments @('-m', 'venv', '.venv') -TimeoutSeconds 60
          & ./scripts/run-project-command.ps1 -FileName "$PWD/.venv/Scripts/python.exe" -Arguments @('-m', 'pip', 'install', '--timeout', '30', '.[dev,build]') -TimeoutSeconds 180
      - name: Verify on Windows
        run: ./scripts/verify-windows.ps1
      - name: Build clean portable ZIP
        run: ./scripts/build-portable.ps1
      - name: Build source wheel
        run: |
          & ./scripts/run-project-command.ps1 -FileName "$PWD/.venv/Scripts/python.exe" -Arguments @('-m', 'pip', 'wheel', '--timeout', '30', '--no-deps', '--no-build-isolation', '--wheel-dir', 'dist', '.') -TimeoutSeconds 120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-candidate
          path: |
            dist/codex-auto-continuer-*-windows-x86_64.zip
            dist/codex_auto_continuer-*-py3-none-any.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
